<text x="450.0" y="174">90 mm +/-5</text>
<text x="20" y="160" font-size="11">soldered; in-line XT30U-F 40 mm from the board</text>
<text x="760" y="160" font-size="11">soldered; XT30U-M on this half</text>
<text x="20" y="198">Route: battery bay roof to the lower right corner of the mainboard.</text>
<text x="20" y="216">Strain relief: heat-shrink over both solder joints; the XT30 pair lets the mainboard come out without unsoldering.</text>
