name: Phase 3 CAD build

# Rebuilds every STEP, STL, drawing, render, check, parts list and the 3D viewer
# from the build123d scripts in hardware/cad. Runs only when started by hand
# (Actions tab -> Phase 3 CAD build -> Run workflow).

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Build steps (comma separated): parts,assembly,renders,steps,drawings,bom,fab,checks,viewer"
        required: false
        default: "parts,assembly,renders,steps,drawings,bom,fab,checks,viewer"
      d31_extra_offset:
        description: "Extra roll-axis offset in mm (Q17 option A = 23)"
        required: false
        default: "23"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the CAD toolchain
        run: |
          python -m pip install --upgrade pip
          pip install build123d numba pypdf trimesh matplotlib pillow numpy

      - name: Build
        working-directory: hardware/cad
        env:
          ST_D31_EXTRA: ${{ github.event.inputs.d31_extra_offset }}
          MPLBACKEND: Agg
        run: python build_all.py --only "${{ github.event.inputs.steps }}"

      - name: Rerun the cost model
        working-directory: docs/calc
        run: python phase2_calcs.py

      - name: Upload the results
        uses: actions/upload-artifact@v4
        with:
          name: phase3-cad-output
          path: |
            hardware/cad/step/
            hardware/cad/stl/
            hardware/cad/out/
            hardware/drawings/
            hardware/fab/
            hardware/bom/
            hardware/viewer/
            docs/img/03-*.png
            docs/calc/bom_data.py
            docs/calc/phase2_results.json
          retention-days: 30
