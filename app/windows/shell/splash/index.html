<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Canopus</title>
<style>
/* Shown while the backend starts. Design "Blue Hour", always dark so nothing flashes white. */
html,body{margin:0;height:100%}
body{background:linear-gradient(180deg,#0f1a2e 0%,#2b4366 55%,#6d84a6 78%,#1d2738 78%,#121821 100%);color:#f1f4f9;
  font:500 15px "Segoe UI Variable","Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.box{display:flex;align-items:center;gap:18px;padding:22px 30px 22px 22px;border-radius:24px;background:rgba(26,36,54,.66);
  border:1px solid rgba(255,255,255,.10);box-shadow:0 18px 50px rgba(5,10,20,.35);backdrop-filter:blur(20px)}
svg{width:64px;height:64px;flex:none}
h1{margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.01em}
#msg{color:#a6b1c4}
.dots::after{content:"";animation:d 1.4s steps(4) infinite}
@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
</style>
</head>
<body>
<div class="box" role="status">
  <svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16243c"/><stop offset=".65" stop-color="#3b5a85"/><stop offset="1" stop-color="#c88f5a"/></linearGradient></defs>
    <rect width="100" height="100" rx="22" fill="url(#g)"/>
    <g fill="none" stroke="#fff" stroke-linecap="round"><path d="M44 30 A22 22 0 0 1 86 26" stroke-opacity=".55" stroke-width="2.6"/><path d="M50 30 A16 16 0 0 1 80 27" stroke-opacity=".38" stroke-width="2.4"/><path d="M56 30 A10 10 0 0 1 74 28" stroke-opacity=".25" stroke-width="2.2"/></g>
    <path d="M65 18 L67.4 26.6 L76 29 L67.4 31.4 L65 40 L62.6 31.4 L54 29 L62.6 26.6Z" fill="#ffb43d"/>
    <path d="M0 78 L18 64 L30 70 L46 54 L60 68 L72 60 L100 76 L100 100 L0 100Z" fill="#1d2738"/></svg>
  <div>
    <h1>Canopus</h1>
    <div id="msg" class="dots">Starting the driver</div>
  </div>
</div>
</body>
</html>
